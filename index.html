<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presenteie Everton & Natália</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gradient-to-b from-orange-50 to-white min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4 p-6 bg-white rounded-lg shadow-lg text-center">
        <!-- <h1 class="text-3xl font-serif text-pink-600 mb-4">Everton & Natália</h1> -->
         <div class="flex justify-center">
            <img src="https://i.ibb.co/fdY47m3Q/E.png" width="300" alt="E" border="0">
         </div>
        <p class="text-gray-600 mb-6">Estamos muito felizes por compartilhar esse momento com vocês! Se desejar nos presentear, aceitamos sua contribuição via Pix com todo carinho.</p>
        
        <div class="flex justify-center mb-6">
            <div id="qrcode" class="p-4 bg-white rounded-lg"></div>
        </div>
        
        <div class="mb-6">
            <p class="text-gray-700 font-semibold mb-2">Chave Pix:</p>
            <div class="flex items-center justify-center">
                <input id="pixCode" type="text" value="074.472.434-18" readonly class="bg-gray-100 p-2 rounded-l-md text-gray-700 focus:outline-none" />
                <button id="copyButton" class="bg-emerald-400 text-white p-2 rounded-r-md hover:bg-emerald-600 transition">Copiar</button>
            </div>
        </div>
        
        <p class="text-gray-500 text-sm">Obrigado por fazer parte do nosso grande dia!</p>
    </div>

    <script>
        // Gera o QR Code
        new QRCode(document.getElementById("qrcode"), {
            text: "074.472.434-18",
            width: 200,
            height: 200,
            colorDark: "#4a044e",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // Função para copiar o código Pix
        const copyButton = document.getElementById("copyButton");
        const pixCode = document.getElementById("pixCode");

        copyButton.addEventListener("click", () => {
            pixCode.select();
            document.execCommand("copy");
            copyButton.textContent = "Copiado!";
            setTimeout(() => {
                copyButton.textContent = "Copiar";
            }, 2000);
        });
    </script>
</body>
</html>
